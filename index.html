<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Angka Matot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        .card { max-width: 600px; background: #2d2d2d; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #444; background: #111; color: #0f0; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #d35400; }
        .box { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 14px; line-height: 1.8; display: none; }
        .dead { background: #3d1a1a; border-left: 5px solid #ff4d4d; }
        .live { background: #1a3d1a; border-left: 5px solid #2ecc71; }
        h2 { color: #e67e22; text-align: center; }
        .highlight { color: #f1c40f; font-weight: bold; }
        #error-msg { color: red; display: none; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
<center>
  <img src="https://g.top4top.io/p_3788kmjf70.gif" width="300">
</center>
<div class="card">
    <h2>GENERATE ANGKA MATOT</h2>
    <form id="filterForm" onsubmit="event.preventDefault(); analisisAngka();">
        <label>Input Result Terakhir (4 Digit):</label>
        <input type="number" id="last_result" placeholder="Contoh: 4321" required>
        <button type="submit">GENERATED</button>
    </form>

    <p id="error-msg">Harap masukkan 4 digit angka!</p>

    <div id="boxDead" class="box dead"></div>
    <div id="boxLive" class="box live"></div>
</div>

<script>
function analisisAngka() {
    const res = document.getElementById('last_result').value;
    const errorMsg = document.getElementById('error-msg');
    const boxDead = document.getElementById('boxDead');
    const boxLive = document.getElementById('boxLive');

    // Sembunyikan hasil sebelumnya
    errorMsg.style.display = 'none';
    boxDead.style.display = 'none';
    boxLive.style.display = 'none';

    if(res.length !== 4) {
        errorMsg.style.display = 'block';
        return;
    }

    // Logika 1: Index Lama
    const Index_lama = {'1':'6', '2':'7', '3':'8', '4':'9', '0':'5', '6':'1', '5':'0', '8':'3', '9':'4', '5':'0'};
    
    // Logika 2: Ekor Mati
    const ekor = res.slice(-1);
    const ekor_mati = mistik_lama[ekor];

    // Logika 3: Jumlah 2D
    const dua_d = res.slice(-2);
    let jumlah_2d = dua_d.split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
    if(jumlah_2d > 10) {
        jumlah_2d = jumlah_2d.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
    }

    let pangkas = [];
    let aman = [];

    for (let i = 0; i <= 99; i++) {
        let n = i.toString().padStart(2, '0');
        
        let jml_n = n.split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
        if(jml_n > 9) {
            jml_n = jml_n.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
        }

        if (n.includes(ekor_mati) || jml_n === jumlah_2d || n === dua_d) {
            pangkas.push(n);
        } else {
            aman.push(n);
        }
    }

    // Tampilkan Hasil
    boxDead.innerHTML = `<b>Angka Pangkas (Probabilitas Keluar Kecil):</b><br>${pangkas.join(', ')}`;
    boxLive.innerHTML = `<b>Angka Kuat (Tersisa <span class='highlight'>${aman.length}</span> Line):</b><br>${aman.join(', ')}`;
    
    boxDead.style.display = 'block';
    boxLive.style.display = 'block';
}
</script>

</body>
</html>
